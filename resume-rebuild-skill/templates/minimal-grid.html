<!DOCTYPE html>
<!-- TEMPLATE: Minimal Grid / ATS-friendly -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>Resume</title><style>
@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;color:#20242a;font:10.5pt/1.45 Arial,"PingFang SC",sans-serif}.page{width:210mm;min-height:297mm;padding:16mm 18mm;margin:auto}header{display:grid;grid-template-columns:1fr auto;gap:16px;border-bottom:2px solid #20242a;padding-bottom:10px;margin-bottom:16px}h1{font-size:25pt;letter-spacing:1px;margin:0}.headline{font-size:12pt;color:#56606b;margin-top:4px}.contact{text-align:right;font-size:9pt;color:#56606b;align-self:end}.contact span{display:block}section{margin-bottom:14px}h2{font-size:10pt;letter-spacing:2px;border-left:4px solid #20242a;padding-left:8px;margin:0 0 8px}.summary{margin:0}.entry{margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px}.title{font-weight:700}.org{color:#56606b}.date{white-space:nowrap;color:#78818b}ul{margin:4px 0 0;padding-left:18px}li{margin:2px 0}.skills{display:block}.skills-row{margin-bottom:4px}
</style></head><body><div class="page"><header><div><h1>姓名</h1><div class="headline">目标职位 / 专业方向</div></div><div class="contact"><span>城市</span><span>邮箱 · 电话</span><span>作品集 / 个人主页</span></div></header><section><h2>Summary</h2><p class="summary">用 2–3 句话概括职业定位、最强能力和目标方向。</p></section><section><h2>Experience</h2><div class="entry"><div class="row"><span><span class="title">职位名称</span> · <span class="org">公司名称</span></span><span class="date">YYYY.MM — Present</span></div><ul><li>动作 + 方法 + 已确认的结果。</li><li>说明个人贡献，不把团队成果直接写成个人成果。</li></ul></div></section><section><h2>Projects</h2><div class="entry"><div class="row"><span class="title">项目名称</span><span class="date">YYYY</span></div><ul><li>背景、个人贡献、方法和结果。</li></ul></div></section><section><h2>Education</h2><div class="entry"><div class="row"><span class="title">学校 · 学位/专业</span><span class="date">YYYY — YYYY</span></div></div></section><section><h2>Skills</h2><div class="skills"><b>核心能力</b><span>能力 1 · 能力 2 · 能力 3</span><b>工具/技术</b><span>按实际情况填写</span></div></section></div></body></html>
